name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://localhost:4200
      API_BASE_URL: http://localhost:3000/api
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install mock-backend dependencies
      run: npm ci
      working-directory: ./mock-backend
    - name: Install mock-app dependencies
      run: npm ci
      working-directory: ./mock-app
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Start mock-backend
      run: nohup node index.js > backend.log 2>&1 &
      working-directory: ./mock-backend
    - name: Start mock-app
      run: nohup npx ng serve > frontend.log 2>&1 &
      working-directory: ./mock-app
    - name: Wait for services to be ready
      run: npx wait-on http://localhost:3000 http://localhost:4200 --timeout 120000
    - name: Show service logs on failure
      if: failure()
      run: |
        echo "=== backend.log ==="
        cat mock-backend/backend.log || echo "no backend.log found"
        echo "=== frontend.log ==="
        cat mock-app/frontend.log || echo "no frontend.log found"
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30